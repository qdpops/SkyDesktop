[package]
name = "skydesktop-app"
version = "0.2.2"
edition = "2021"
description = "Оконное приложение SkyDesktop: нативное окно, встроенный UI и мост к ядру"

[[bin]]
name = "SkyDesktop"
path = "src/main.rs"

[dependencies]
skydesktop-bridge = { path = "../skydesktop-bridge" }
# Настоящее ядро удалённого доступа (форк RustDesk с доработками SkyDesktop).
rustdesk = { path = "../../vendor/rustdesk", default-features = false, features = ["use_dasp"] }
hbb_common = { path = "../../vendor/rustdesk/libs/hbb_common" }
scrap = { path = "../../vendor/rustdesk/libs/scrap", features = ["wayland"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Сверка контрольной суммы скачанного обновления.
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tao = "0.37"
softbuffer = "0.4"
# Своя отрисовка интерфейса: без GPU и без внешних компонентов.
tiny-skia = "0.12"
fontdue = "0.9"
# Разбор путей значков Bootstrap Icons.
svgtypes = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Time",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
